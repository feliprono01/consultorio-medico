# ─────────────────────────────────────────────────────────
# Zonas de rate limiting (definidas FUERA del bloque server)
# ─────────────────────────────────────────────────────────

# Login: máx 5 requests por minuto por IP (anti brute force)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# API general: máx 30 requests por segundo por IP (anti flooding)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Conexiones simultáneas: máx 20 por IP (anti slowloris)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────
    # Límites globales
    # ─────────────────────────────────────────────────────
    client_max_body_size 2m;        # Rechazar bodies > 2MB
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    limit_conn conn_limit 20;       # Máx 20 conexiones simultáneas por IP

    # ─────────────────────────────────────────────────────
    # Headers de seguridad HTTP
    # ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Ocultar versión de nginx
    server_tokens off;

    # ─────────────────────────────────────────────────────
    # Manejo de rutas de React SPA
    # ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────
    # Login: rate limiting ESTRICTO (5 req/min por IP)
    # ─────────────────────────────────────────────────────
    location = /api/auth/login {
        limit_req zone=login_limit burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────
    # API general: rate limiting moderado (30 req/s por IP)
    # ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────────────────────
    # Cache para assets estáticos
    # ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
