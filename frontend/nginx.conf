# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Consultorio Médico (Producción con HTTPS/TLS)
# ─────────────────────────────────────────────────────────────────────────────
# INSTRUCCIONES SSL:
#   1. Obtener certificado con Certbot (Let's Encrypt) en el servidor:
#      sudo certbot certonly --nginx -d TU_DOMINIO.com
#   2. Reemplazar las rutas /etc/letsencrypt/live/TU_DOMINIO.com/ con las reales.
#   3. Reiniciar Nginx: sudo nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────
# Zonas de rate limiting (definidas FUERA del bloque server)
# ─────────────────────────────────────────────────────────

# Login: máx 5 requests por minuto por IP (anti brute force)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# API general: máx 30 requests por segundo por IP (anti flooding)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Conexiones simultáneas: máx 20 por IP (anti slowloris)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─────────────────────────────────────────────────────────────────────────────
# BLOQUE 1: HTTP (puerto 80) — redirige TODO a HTTPS
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirigir cualquier petición HTTP a HTTPS (301 permanente)
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# BLOQUE 2: HTTPS (puerto 443) — servidor principal
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────
    # Certificados SSL — generados con Certbot / Let's Encrypt
    # Reemplazar con las rutas reales del servidor del cliente
    # ─────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.com/privkey.pem;

    # Protocolos y ciphers seguros (deshabilitar TLS 1.0 y 1.1 obsoletos)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Sesiones SSL cacheadas para mejor performance
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling — mejora velocidad de verificación del certificado
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ─────────────────────────────────────────────────────
    # Límites globales
    # ─────────────────────────────────────────────────────
    client_max_body_size 2m;        # Rechazar bodies > 2MB
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout         10s;
    keepalive_timeout    30s;
    limit_conn conn_limit 20;       # Máx 20 conexiones simultáneas por IP

    # Ocultar versión de nginx
    server_tokens off;

    # ─────────────────────────────────────────────────────
    # Headers de seguridad HTTP
    # ─────────────────────────────────────────────────────

    # HSTS — fuerza HTTPS por 1 año en el navegador (Ley de buenas prácticas SSL)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Evitar que la app se cargue en un iframe de otro dominio (anti-clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Evitar que el navegador intente adivinar el MIME type (anti-MIME sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Protección XSS adicional para navegadores legacy
    add_header X-XSS-Protection "1; mode=block" always;

    # Controlar qué información se envía en el header Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deshabilitar APIs de hardware innecesarias (privacidad del paciente)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content Security Policy — restringir de dónde puede cargar recursos la app
    # IMPORTANTE: Ajustar 'default-src' con el dominio real si se usan CDNs externos
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ─────────────────────────────────────────────────────
    # Manejo de rutas de React SPA
    # ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────
    # Login: rate limiting ESTRICTO (5 req/min por IP)
    # ─────────────────────────────────────────────────────
    location = /api/auth/login {
        limit_req zone=login_limit burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────
    # API general: rate limiting moderado (30 req/s por IP)
    # ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────────────────────
    # Cache para assets estáticos
    # ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
