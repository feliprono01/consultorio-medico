# ========================================
# CONFIGURACIÓN DE BASE DE DATOS - PROD
# ========================================
# Las variables ${...} deben ser definidas en el servidor
# DB_PASSWORD es OBLIGATORIA — el backend falla al arrancar si no está definida
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ========================================
# En producción, solo validar el esquema, nunca actualizarlo automáticamente
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================================
# CONFIGURACIÓN DE SEGURIDAD
# ========================================
# El secreto debe ser una variable de entorno larga y segura
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Usuario admin inicial — OBLIGATORIAS en producción, sin default admin/admin
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# ========================================
# CONFIGURACIÓN CORS
# ========================================
# URLs permitidas separadas por comas (ej: https://mi-dominio.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ========================================
# CONFIGURACIÓN DE BACKUPS (PROD)
# ========================================
# En Linux/Docker 'mysqldump' funciona si el paquete mysql-client está instalado
backup.mysqldump-path=${MYSQLDUMP_PATH:mysqldump}
backup.output-dir=${BACKUP_OUTPUT_DIR:./backups}
backup.cron=${BACKUP_CRON:0 0 2 * * ?}
# Email destino del backup — OBLIGATORIO en producción
backup.email.to=${BACKUP_EMAIL_TO}
# Contraseña del ZIP cifrado de backup — OBLIGATORIA en producción
backup.zip.password=${BACKUP_ZIP_PASSWORD}

# ========================================
# CIFRADO EN REPOSO — PRODUCCIÓN
# ========================================
# Clave AES-256-GCM para campos médicos sensibles — OBLIGATORIA
# NUNCA perder esta clave: sin ella los datos médicos son irrecuperables
app.security.encryption-key=${ENCRYPTION_KEY}

# ========================================
# SWAGGER/API DOCS — DESHABILITADO EN PROD
# ========================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ========================================
# JWT COOKIE — PRODUCCIÓN
# ========================================
# En producción (HTTPS) la cookie debe llevar el flag Secure
jwt.cookie.secure=true

# ========================================
# MEMBRETE DEL PDF (Ley 26.529)
# ========================================
# Configurar estas variables en el servidor para personalizar el PDF del médico
pdf.medico.nombre=${PDF_MEDICO_NOMBRE}
pdf.medico.especialidad=${PDF_MEDICO_ESPECIALIDAD}
pdf.medico.matricula=${PDF_MEDICO_MATRICULA}
pdf.medico.direccion=${PDF_MEDICO_DIRECCION}
pdf.medico.telefono=${PDF_MEDICO_TELEFONO}
