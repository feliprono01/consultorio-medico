# ========================================
# CONFIGURACIÓN DE BASE DE DATOS - MySQL
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/consultorio_medico?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Default vacío: XAMPP local no requiere contraseña. En producción se usa application-prod.properties (sin default).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ========================================
# Estrategia de generación de tablas (update = actualiza sin borrar datos)
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de timezone para Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================================
# CONFIGURACIÓN DE LOGGING
# ========================================
# Nivel de log para SQL y parámetros
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================================
# CONFIGURACIÓN DE SERVIDOR
# ========================================
server.port=8080

# Configuración de contexto (opcional)
# server.servlet.context-path=/api

# ========================================
# CONFIGURACIÓN DE SEGURIDAD
# ========================================
# Clave para firma de tokens — definir JWT_SECRET como variable de entorno (sin default por seguridad)
jwt.secret=${JWT_SECRET}
# Expiración: 24 horas (en milisegundos)
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (Development defaults)
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3007,http://localhost:5173,http://localhost

# ========================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ========================================
# Formato de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================================
# CONFIGURACIÓN DE BACKUPS
# ========================================
# Path a mysqldump:
#   - Local (XAMPP): C:/xampp/mysql/bin/mysqldump.exe
#   - Linux/Docker:  mysqldump  (si está en PATH del sistema)
# Configurar via variable de entorno MYSQLDUMP_PATH en producción
backup.mysqldump-path=${MYSQLDUMP_PATH:mysqldump}

# Directorio donde se guardan los backups (en Docker: mapear a un volumen)
backup.output-dir=${BACKUP_OUTPUT_DIR:./backups}

# Cron expression para el backup automático
# Default: todos los días a las 02:00 AM  →  "0 0 2 * * ?"
# Configurar via BACKUP_CRON para cambiar la frecuencia sin tocar el código
backup.cron=${BACKUP_CRON:0 0 2 * * ?}

# ========================================
# CONFIGURACIÓN DE CORREO (SMTP)
# ========================================
# Email al que se enviarán los backups (configurable via BACKUP_EMAIL_TO)
backup.email.to=${BACKUP_EMAIL_TO:feliprono2001@gmail.com}

# Credenciales del emisor (ej: Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:feliprono2001@gmail.com}
# Contraseña de app Gmail — definir SPRING_MAIL_PASSWORD como variable de entorno (sin default por seguridad)
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
