# ========================================
# CONFIGURACIÓN DE BASE DE DATOS - MySQL
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/consultorio_medico?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:consultorio_user}
# Credenciales del usuario dedicado (con permisos limitados). En producción usar application-prod.properties o variables de entorno.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ConsultorioDB2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ========================================
# Estrategia de generación de tablas (update = actualiza sin borrar datos)
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de timezone para Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================================
# CONFIGURACIÓN DE LOGGING
# ========================================
# Sin TRACE de BasicBinder a propósito: ese nivel vuelca los valores reales de
# los parámetros bind en cada query (texto plano de campos cifrados y datos
# clínicos) a la consola. spring.jpa.show-sql ya muestra el SQL sin params.
logging.level.org.hibernate.SQL=INFO

# ========================================
# CONFIGURACIÓN DE SERVIDOR
# ========================================
server.port=8080

# Configuración de contexto (opcional)
# server.servlet.context-path=/api

# ========================================
# CONFIGURACIÓN DE SEGURIDAD
# ========================================
# Clave para firma de tokens — definir JWT_SECRET como variable de entorno (sin default por seguridad)
jwt.secret=${JWT_SECRET}
# Expiración: 24 horas (en milisegundos)
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (Development defaults)
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3007,http://localhost:5173,http://localhost

# ========================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ========================================
# Formato de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================================
# CONFIGURACIÓN DE BACKUPS
# ========================================
# Path a mysqldump:
#   - Local (XAMPP): C:/xampp/mysql/bin/mysqldump.exe
#   - Linux/Docker:  mysqldump  (si está en PATH del sistema)
# Configurar via variable de entorno MYSQLDUMP_PATH en producción
backup.mysqldump-path=C:/xampp/mysql/bin/mysqldump.exe

# Directorio donde se guardan los backups (en Docker: mapear a un volumen)
backup.output-dir=${BACKUP_OUTPUT_DIR:./backups}

# Cron expression para el backup automático
# Default: todos los días a las 02:00 AM  →  "0 0 2 * * ?"
# Configurar via BACKUP_CRON para cambiar la frecuencia sin tocar el código
backup.cron=${BACKUP_CRON:0 0 2 * * ?}

# Contraseña para cifrar el archivo ZIP de backup
backup.zip.password=${BACKUP_ZIP_PASSWORD:SecurePassword123!}

# Días de retención para backups antiguos antes de eliminarlos
backup.retention.days=${BACKUP_RETENTION_DAYS:30}

# ========================================
# CONFIGURACIÓN DE CORREO (SMTP)
# ========================================
# Email al que se enviarán los backups (configurable via BACKUP_EMAIL_TO)
backup.email.to=${BACKUP_EMAIL_TO:feliprono2001@gmail.com}

# Credenciales del emisor (ej: Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:feliprono2001@gmail.com}
# Contraseña de app Gmail — definir SPRING_MAIL_PASSWORD como variable de entorno (sin default por seguridad)
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================================
# USUARIO ADMIN INICIAL (solo dev — en prod usar ADMIN_USERNAME/ADMIN_PASSWORD)
# ========================================
# Sin default admin/admin a propósito: cambiá esta contraseña si vas a exponer
# este entorno más allá de tu máquina local.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:DevLocal_ChangeMe_2026!}

# ========================================
# CONFIGURACIÓN DE CIFRADO EN REPOSO (JPA ATTRIBUTE CONVERTER)
# ========================================
# Clave maestra para encriptación AES-256-GCM de campos médicos sensibles
# Debe configurarse via variable de entorno ENCRYPTION_KEY en producción
app.security.encryption-key=${ENCRYPTION_KEY:ConsultorioMedicoSecretKey2026!AES256GCM}

# ========================================
# CONFIGURACIÓN DEL MEMBRETE EN PDF
# (Ley 26.529 — Historia Clínica legal)
# ========================================
# Nombre completo del profesional tal como debe aparecer en el PDF
pdf.medico.nombre=${PDF_MEDICO_NOMBRE:Dr/a. Nombre Apellido}
# Especialidad (ej: Médico Psiquiatra, Médico Clínico, etc.)
pdf.medico.especialidad=${PDF_MEDICO_ESPECIALIDAD:Médico Psiquiatra}
# Matrícula Nacional (M.N.) o Provincial (M.P.)
pdf.medico.matricula=${PDF_MEDICO_MATRICULA:M.N. 000000}
# Dirección física del consultorio
pdf.medico.direccion=${PDF_MEDICO_DIRECCION:Dirección del Consultorio, Ciudad, Provincia}
# Teléfono de contacto del consultorio (opcional)
pdf.medico.telefono=${PDF_MEDICO_TELEFONO:Tel: (000) 000-0000}

